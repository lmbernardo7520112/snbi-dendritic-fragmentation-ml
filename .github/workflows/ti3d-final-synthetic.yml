name: ti3d-final-synthetic-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ti3d-final-synthetic-contracts:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Enforce tracked-data guard
        run: python3 -B scripts/check_repository_data.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""
      - name: Install unchanged LBP RF pins with existing transitive constraints
        run: >-
          python -B -m pip --isolated install
          --disable-pip-version-check --no-cache-dir
          --only-binary=:all: -r requirements-ti3-ml.txt
          -c constraints-ti3c-cnn.txt
      - name: Enforce composed scope and preserved historical custody
        run: python -B scripts/check_phase_scope.py
      - name: Require final evaluation synthetic contracts with zero skips
        run: |
          python -B - <<'PY'
          import json
          import unittest
          from pathlib import Path
          from snbi_fragmentation.ti3_baseline import _scientific_runtime

          _scientific_runtime()
          proof = json.loads(Path("artifacts/evidence/TI3_D_FINAL/preparation-verification.json").read_text())
          expected = proof["final_synthetic_test_count"]
          if type(expected) is not int or expected <= 0:
              raise SystemExit("Explicit frozen synthetic count required")
          suite = unittest.defaultTestLoader.loadTestsFromNames(
              ["test_ti3d_final", "test_ti3d_support", "test_ti3d_execution"]
          )
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          passed = (
              result.testsRun == expected and result.wasSuccessful()
              and not result.skipped and not result.expectedFailures
              and not result.unexpectedSuccesses
          )
          raise SystemExit(0 if passed else 1)
          PY
