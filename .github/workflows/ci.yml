name: deterministic-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ti0-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""
      - name: Compile source
        run: python -m compileall -q src tests scripts
      - name: Validate canonical manifest
        run: PYTHONPATH=src python -m snbi_fragmentation.custody validate configs/sources/source_manifest.json
      - name: Enforce TI-0 scope
        run: PYTHONPATH=src python scripts/check_ti0_scope.py
      - name: Run deterministic tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

