name: study4-synthetic-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  study4-synthetic-contracts:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:tests:.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: ""
      - name: Enforce tracked-data guard
        run: python3 -B -S scripts/check_repository_data.py
      - name: Enforce phase scope and historical custody
        run: python3 -B -S scripts/check_phase_scope.py
      - name: Enforce existing Study3 governance composition
        run: python3 -B -S scripts/check_study3_governance.py
      - name: Require all Study4 synthetic contracts without site packages
        run: |
          python3 -B -S - <<'PYTEST'
          import json
          import unittest

          loader = unittest.TestLoader()
          suite = loader.discover("tests", pattern="test_study4*.py")
          expected = suite.countTestCases()
          if loader.errors or expected <= 0:
              raise SystemExit("Study4 synthetic discovery failed")
          result = unittest.TextTestRunner(verbosity=2, failfast=True).run(suite)
          print(json.dumps({"tests": result.testsRun,
                            "passes": result.testsRun - len(result.failures) - len(result.errors) - len(result.skipped),
                            "skips": len(result.skipped), "failures": len(result.failures), "errors": len(result.errors)}))
          passed = (result.testsRun == expected and result.wasSuccessful()
                    and not result.skipped and not result.expectedFailures
                    and not result.unexpectedSuccesses)
          raise SystemExit(0 if passed else 1)
          PYTEST
